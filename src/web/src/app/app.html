<mat-toolbar>
  <button
    matIconButton
    type="button"
    aria-label="Afficher ou masquer le menu"
    (click)="menu.toggle()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <h1>{{ titre() }}</h1>

  @if (session.utilisateur(); as utilisateur) {
    <span class="utilisateur"
      >{{ utilisateur.prenom ?? utilisateur.email }} {{ utilisateur.nom }}</span
    >
    <button matButton type="button" (click)="seDeconnecter()">Se déconnecter</button>
  }
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav #menu mode="side" opened>
    <mat-nav-list aria-label="Menu principal">
      @for (lien of liensVisibles(); track lien.chemin) {
        <a
          mat-list-item
          [routerLink]="lien.chemin"
          routerLinkActive
          #etat="routerLinkActive"
          [activated]="etat.isActive"
          ariaCurrentWhenActive="page"
        >
          <mat-icon matListItemIcon>{{ lien.icone }}</mat-icon>
          <span matListItemTitle>{{ lien.libelle }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content role="main">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
