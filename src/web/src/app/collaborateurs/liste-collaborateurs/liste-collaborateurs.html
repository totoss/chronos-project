<h2>Collaborateurs</h2>

<div class="outils">
  <app-barre-de-recherche
    libelle="Filtrer par nom"
    [recherche]="recherche()"
    (rechercheChange)="rechercher($event)"
  />

  <button matButton="outlined" type="button" (click)="basculerSortis()">
    @if (afficherSortis()) {
      Masquer les collaborateurs sortis
    } @else {
      Afficher les collaborateurs sortis
    }
  </button>
  <button matButton="outlined" type="button" (click)="basculerTri()">
    @if (tri() === 'nom') {
      Trier par date d'entrée
    } @else {
      Trier par nom
    }
  </button>
  <a matButton="filled" routerLink="nouveau">
    <mat-icon>add</mat-icon>
    Nouveau collaborateur
  </a>
</div>

@let resultats = collaborateursFiltres();

<app-compteur-de-resultats [nombre]="resultats.length" [total]="collaborateurs().length" />
<p>{{ repartition() }}</p>

<div class="cartes">
  @for (c of resultats; track c.id) {
    <app-carte-collaborateur [collaborateur]="c" />
  } @empty {
    <p>Aucun collaborateur ne correspond à « {{ recherche() }} ».</p>
  }
</div>
