<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ nomComplet() }}</mat-card-title>
    <mat-card-subtitle>{{ collaborateur().poste }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ collaborateur().matricule }}</p>
    @if (collaborateur().estSorti) {
      <p class="sorti">A quitté la société</p>
    }
  </mat-card-content>

  <mat-card-actions align="end">
    <button *appSiRole="'GestionnaireRh'" matButton type="button" (click)="supprimer.emit()">
      <mat-icon>delete</mat-icon>
      Supprimer
    </button>
    <a matButton [routerLink]="['/collaborateurs', collaborateur().id]">
      <mat-icon>visibility</mat-icon>
      Voir la fiche
    </a>
  </mat-card-actions>
</mat-card>
