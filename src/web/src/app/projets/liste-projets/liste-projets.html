<h2>Projets</h2>

<div class="outils">
  <app-barre-de-recherche libelle="Filtrer par code, libellé ou client" [(recherche)]="recherche" />

  <label for="statut">Statut</label>
  <select id="statut" #choix (change)="statutFiltre.set(choix.value)">
    <option value="">Tous</option>
    <option value="EnPreparation">En préparation</option>
    <option value="EnCours">En cours</option>
    <option value="Termine">Terminé</option>
    <option value="Annule">Annulé</option>
  </select>
</div>

@let resultats = projetsFiltres();

<app-compteur-de-resultats nom="projet" [nombre]="resultats.length" [total]="projets().length" />

<div class="cartes">
  @for (p of resultats; track p.code) {
    <app-carte-projet [projet]="p" />
  } @empty {
    <p>Aucun projet ne correspond à ces critères.</p>
  }
</div>
